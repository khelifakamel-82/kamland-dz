<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMLAND DZ - Administration</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
header{background:#111;color:#fff;padding:20px;text-align:center;border-bottom:3px solid #d8a928}
.container{max-width:600px;margin:30px auto;padding:20px}.box{background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px #0002}
h1{margin:0 0 5px}h2{margin-top:0}label{display:block;margin-top:15px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sizes input{width:80px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#20c76a;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}#message,#loginMessage{margin-top:15px;text-align:center;font-weight:bold}
.preview{width:100%;max-height:250px;object-fit:contain;margin-top:10px;border-radius:10px;display:none}
#adminPanel{display:none}.logout{background:#d62828;margin-top:10px}.login-button{background:#111}
.user-info{background:#f1f1f1;padding:10px;border-radius:8px;margin-bottom:15px;font-size:14px;word-break:break-all}
</style>
</head>
<body>
<header><h1>KAMLAND DZ</h1><div>Administration</div></header>
<div class="container">
<div class="box" id="loginPanel">
<h2>🔐 Connexion administrateur</h2>
<label>Adresse e-mail</label><input id="loginEmail" type="email" placeholder="Votre adresse e-mail" autocomplete="email">
<label>Mot de passe</label><input id="loginPassword" type="password" placeholder="Votre mot de passe" autocomplete="current-password">
<button class="login-button" onclick="loginAdmin()">🔐 SE CONNECTER</button>
<div id="loginMessage"></div>
</div>

<div class="box" id="adminPanel">
<h2>➕ Ajouter un produit</h2>
<div class="user-info">👤 Administrateur connecté<br><span id="adminEmail"></span></div>
<button class="logout" onclick="logoutAdmin()">🚪 SE DÉCONNECTER</button>
<label>Marque</label>
<select id="brand"><option value="">Choisir une marque</option><option>Adidas</option><option>Nike</option><option>Reebok</option><option>The North Face</option><option>Autre</option></select>
<label>Nom du produit</label><input id="name" placeholder="Ex : Nike Air Max">
<label>Prix (DA)</label><input id="price" type="number" placeholder="Ex : 15000">
<label>Lien direct de la photo</label><input id="image" placeholder="https://i.postimg.cc/...">
<img id="preview" class="preview" alt="Aperçu du produit">
<label>Pointures</label>
<div class="sizes">
<input id="size1" type="number" step="0.5" placeholder="40"><input id="size2" type="number" step="0.5" placeholder="41">
<input id="size3" type="number" step="0.5" placeholder="42"><input id="size4" type="number" step="0.5" placeholder="43">
<input id="size5" type="number" step="0.5" placeholder="44"><input id="size6" type="number" step="0.5" placeholder="45">
</div>
<button onclick="addProduct()">➕ AJOUTER LE PRODUIT</button>
<div id="message"></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAE5HUTFnWp3NJ-c4cMxq3014XjK7nxetc",authDomain:"kamland-dz.firebaseapp.com",projectId:"kamland-dz",storageBucket:"kamland-dz.firebasestorage.app",messagingSenderId:"821915710530",appId:"1:821915710530:web:4b6734b44c62f18f88a9db",measurementId:"G-71TMDK1LRC"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const ADMIN_UID="O8N1eA6S3DMJDb95TXGx9twUos53";

auth.onAuthStateChanged(user=>{
if(user){
if(user.uid!==ADMIN_UID){auth.signOut();document.getElementById("loginMessage").textContent="❌ Ce compte n'est pas autorisé.";return}
loginPanel.style.display="none";adminPanel.style.display="block";adminEmail.textContent=user.email||"";
}else{loginPanel.style.display="block";adminPanel.style.display="none"}
});

async function loginAdmin(){
const email=loginEmail.value.trim(),password=loginPassword.value;
if(!email||!password){loginMessage.style.color="red";loginMessage.textContent="⚠️ Entre ton e-mail et ton mot de passe.";return}
loginMessage.style.color="#555";loginMessage.textContent="⏳ Connexion en cours...";
try{await auth.signInWithEmailAndPassword(email,password);loginMessage.textContent=""}
catch(e){loginMessage.style.color="red";loginMessage.textContent=e.code==="auth/invalid-credential"?"❌ E-mail ou mot de passe incorrect.":"❌ Erreur : "+e.message}
}
async function logoutAdmin(){await auth.signOut()}

image.addEventListener("input",()=>{
if(image.value.trim()){preview.src=image.value.trim();preview.style.display="block"}else preview.style.display="none";
});
preview.addEventListener("error",()=>preview.style.display="none");

async function addProduct(){
const user=auth.currentUser;
if(!user||user.uid!==ADMIN_UID){message.style.color="red";message.textContent="❌ Accès administrateur refusé.";return}
const sizes=[];
for(let i=1;i<=6;i++){const v=document.getElementById("size"+i).value;if(v!=="")sizes.push(Number(v))}
if(!brand.value||!name.value.trim()||!Number(price.value)||!image.value.trim()||!sizes.length){message.style.color="red";message.textContent="⚠️ Remplis tous les champs obligatoires.";return}
try{
await db.collection("products").add({brand:brand.value,image:image.value.trim(),name:name.value.trim(),price:Number(price.value),sizes,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
message.style.color="green";message.textContent="✅ Produit ajouté avec succès !";
brand.value="";name.value="";price.value="";image.value="";preview.style.display="none";
for(let i=1;i<=6;i++)document.getElementById("size"+i).value="";
}catch(e){message.style.color="red";message.textContent="❌ Erreur Firebase : "+e.message}
}
loginPassword.addEventListener("keydown",e=>{if(e.key==="Enter")loginAdmin()});
</script>
</body>
</html>
