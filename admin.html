<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMLAND DZ - Administration</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}header{background:#111;color:#fff;padding:20px;text-align:center;border-bottom:3px solid #d8a928}.container{max-width:650px;margin:30px auto;padding:20px}.box{background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px #0002}label{display:block;margin-top:15px;font-weight:bold}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:8px;font-size:16px}.photo{margin-top:10px}.preview{width:100%;height:130px;object-fit:contain;margin-top:7px;border-radius:10px;background:#eee;display:none}.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sizes input{width:80px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#20c76a;color:#fff;font-size:17px;font-weight:bold}.logout{background:#d62828}#adminPanel{display:none}#message,#loginMessage{text-align:center;font-weight:bold;margin-top:15px}.note{font-size:13px;color:#666;margin-top:8px}</style></head>
<body><header><h1>KAMLAND DZ</h1><div>Administration</div></header><div class="container">
<div class="box" id="loginPanel"><h2>🔐 Connexion administrateur</h2><label>Adresse e-mail</label><input id="loginEmail" type="email"><label>Mot de passe</label><input id="loginPassword" type="password"><button onclick="loginAdmin()">🔐 SE CONNECTER</button><div id="loginMessage"></div></div>
<div class="box" id="adminPanel"><h2>➕ Ajouter un produit</h2><div>👤 Administrateur connecté<br><span id="adminEmail"></span></div><button class="logout" onclick="logoutAdmin()">🚪 SE DÉCONNECTER</button>
<label>Marque</label><select id="brand"><option value="">Choisir une marque</option><option>Adidas</option><option>Nike</option><option>Reebok</option><option>The North Face</option><option>Autre</option></select>
<label>Nom du produit</label><input id="name" placeholder="Ex : Nike Air Max"><label>Prix (DA)</label><input id="price" type="number" placeholder="Ex : 15000">
<label>Photos — liens directs</label>
<div id="photos"></div><div class="note">Aucun Firebase Storage. Colle des liens directs. La photo 1 est principale. Les anciennes annonces ne sont pas modifiées.</div>
<label>Pointures</label><div class="sizes">${''.join(f'<input id="size{i}" type="number" step="0.5" placeholder="{39+i}">' for i in range(1,7))}</div>
<button onclick="addProduct()">➕ AJOUTER LE PRODUIT</button><div id="message"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const c={apiKey:"AIzaSyAE5HUTFnWp3NJ-c4cMxq3014XjK7nxetc",authDomain:"kamland-dz.firebaseapp.com",projectId:"kamland-dz",storageBucket:"kamland-dz.firebasestorage.app",messagingSenderId:"821915710530",appId:"1:821915710530:web:4b6734b44c62f18f88a9db",measurementId:"G-71TMDK1LRC"};firebase.initializeApp(c);const auth=firebase.auth(),db=firebase.firestore(),uid="O8N1eA6S3DMJDb95TXGx9twUos53",g=id=>document.getElementById(id);
for(let i=1;i<=6;i++){g("photos").insertAdjacentHTML("beforeend",'<div class="photo"><b>📸 Photo '+i+(i===1?' (principale) *':'')+'</b><input id="image'+i+'" placeholder="https://i.ibb.co/..."><img id="preview'+i+'" class="preview"></div>');g("image"+i).oninput=function(){let p=g("preview"+i);p.src=this.value;p.style.display=this.value?'block':'none'};}
auth.onAuthStateChanged(u=>{if(u&&u.uid===uid){g("loginPanel").style.display="none";g("adminPanel").style.display="block";g("adminEmail").textContent=u.email||""}else{g("loginPanel").style.display="block";g("adminPanel").style.display="none"}});
async function loginAdmin(){try{await auth.signInWithEmailAndPassword(g("loginEmail").value.trim(),g("loginPassword").value);g("loginMessage").textContent=""}catch(e){g("loginMessage").style.color="red";g("loginMessage").textContent="❌ "+e.message}}
async function logoutAdmin(){await auth.signOut()}
async function addProduct(){let u=auth.currentUser;if(!u||u.uid!==uid)return;let images=[],sizes=[];for(let i=1;i<=6;i++){let x=g("image"+i).value.trim(),s=g("size"+i).value;if(x)images.push(x);if(s!=="")sizes.push(Number(s))}if(!g("brand").value||!g("name").value.trim()||!Number(g("price").value)||!images.length||!sizes.length){g("message").style.color="red";g("message").textContent="⚠️ Remplis les champs obligatoires.";return}try{await db.collection("products").add({brand:g("brand").value,name:g("name").value.trim(),price:Number(g("price").value),images:images,image:images[0],sizes:sizes,createdAt:firebase.firestore.FieldValue.serverTimestamp()});g("message").style.color="green";g("message").textContent="✅ Produit ajouté avec succès !"}catch(e){g("message").style.color="red";g("message").textContent="❌ "+e.message}}
</script></body></html>
